[workspace]
members = ["."]
resolver = "3"

[package]
name = "bedrock-net"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Native Rust transport and session foundations for Minecraft Bedrock"
repository = "https://github.com/cinnabar-mc/bedrock-net"
readme = "README.md"
publish = false

[dependencies]
aes = { version = "0.9", features = ["zeroize"] }
bytes = "1"
ctr = { version = "0.10", features = ["zeroize"] }
flate2 = "1"
sha2 = "0.11"
snap = "1"
subtle = "2"
thiserror = "2"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"
perf = "warn"

[lints]
workspace = true
