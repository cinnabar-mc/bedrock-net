[workspace]
members = [".", "crates/bedrock-client", "crates/bedrock-client-tokio", "crates/bedrock-packs", "examples/client"]
default-members = [".", "crates/bedrock-client", "crates/bedrock-packs"]
resolver = "3"

[workspace.package]
rust-version = "1.93"

[workspace.dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
bedrock-protocol = { package = "bedrock-protocol-contract-1-26-60", git = "https://github.com/cinnabar-mc/protocolgen", rev = "9eed056998235e4c01e0f3befabed651021dea77" }
bedrock-services = { git = "https://github.com/cinnabar-mc/bedrock-services", rev = "addf20c9465d75b169c1ab447af00554c23947f5", features = ["signaling-tokio"] }
nethernet = { git = "https://github.com/cinnabar-mc/nethernet", rev = "c37c4bf17ede2e5ff749198f7ab19f59a7939750" }
nethernet-tokio = { git = "https://github.com/cinnabar-mc/nethernet", rev = "c37c4bf17ede2e5ff749198f7ab19f59a7939750" }
p384 = { version = "0.14", default-features = false, features = ["alloc", "ecdsa", "pkcs8"] }

[package]
name = "bedrock-net"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Native Rust transport and session foundations for Minecraft Bedrock"
repository = "https://github.com/cinnabar-mc/bedrock-net"
readme = "README.md"

[features]
default = []
login = ["dep:base64", "dep:md-5", "dep:p384", "dep:p224", "dep:p256", "dep:p521", "dep:serde", "dep:serde_json", "dep:uuid", "dep:sha2", "dep:zeroize", "dep:num-bigint", "dep:sha1"]
provider-verification = ["login", "dep:nethernet"]
messaging = ["dep:zeroize", "dep:bedrock-services", "dep:futures", "dep:nethernet", "dep:nethernet-tokio", "dep:tokio", "dep:uuid", "uuid/v4"]

[dependencies]
base64 = { version = "0.22", optional = true }
bytes = "1"
bedrock-services = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
nethernet = { workspace = true, optional = true }
nethernet-tokio = { workspace = true, optional = true }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
num-bigint = { version = "0.4", optional = true }
md-5 = { version = "0.11", optional = true }
p224 = { version = "0.13.2", default-features = false, features = ["ecdsa"], optional = true }
p256 = { version = "0.14", default-features = false, features = ["ecdsa"], optional = true }
p384 = { workspace = true, optional = true }
p521 = { version = "0.14", default-features = false, features = ["ecdsa"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["raw_value"], optional = true }
sha2 = { version = "0.11", optional = true }
sha1 = { version = "0.10", optional = true }
snap = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "time", "macros"], optional = true }
zeroize = { version = "1", optional = true }
uuid = { version = "1", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
libdeflater = "=1.26.1"

[dev-dependencies]
sha2 = "0.11"
rand = "0.10"
rsa = { version = "0.10.0-rc.19", default-features = false, features = ["std", "sha2"] }
base64 = "0.22"
criterion.workspace = true
bedrock-services = { workspace = true, features = ["test-support"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "test-util", "process", "io-util"] }
tokio-websockets = { version = "0.13", default-features = false, features = ["client", "server", "aws_lc_rs", "getrandom"] }

[[bench]]
name = "batch"
harness = false

[[bench]]
name = "login"
harness = false
required-features = ["login"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
# Opt into useful pedantic checks without imposing the entire style group.
doc_markdown = "warn"
unnested_or_patterns = "warn"
used_underscore_binding = "warn"

[lints]
workspace = true
