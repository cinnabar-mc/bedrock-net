[workspace]
members = [".", "examples/client"]
default-members = ["."]
resolver = "3"

[workspace.package]
rust-version = "1.93"

[package]
name = "bedrock-net"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Native Rust transport and session foundations for Minecraft Bedrock"
repository = "https://github.com/cinnabar-mc/bedrock-net"
readme = "README.md"
publish = false

[features]
default = []
login = ["dep:base64", "dep:p384", "dep:serde", "dep:serde_json", "sha2/zeroize"]
raknet = ["dep:raknet", "dep:tokio"]

[dependencies]
aes = { version = "0.9", features = ["zeroize"] }
base64 = { version = "0.22", optional = true }
bytes = "1"
ctr = { version = "0.10", features = ["zeroize"] }
flate2 = "1"
p384 = { version = "0.14", default-features = false, features = ["std", "ecdsa", "ecdh", "pkcs8"], optional = true }
raknet = { git = "https://github.com/cinnabar-mc/raknet", rev = "e570810c8942b783644da4484a2ab1e33adb7089", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["raw_value"], optional = true }
sha2 = "0.11"
snap = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["net", "time", "macros"], optional = true }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "time", "test-util", "process", "io-util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"
perf = "warn"

[lints]
workspace = true
