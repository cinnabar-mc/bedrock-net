[workspace]
members = [".", "crates/bedrock-client", "crates/bedrock-packs", "examples/client"]
default-members = [".", "crates/bedrock-client", "crates/bedrock-packs"]
resolver = "3"

[workspace.package]
rust-version = "1.93"

[workspace.dependencies]
bedrock-protocol = { package = "bedrock-protocol-1-26-51", git = "https://github.com/cinnabar-mc/protocolgen", rev = "4e9626abbb51b8fa842f49b4aea0fb4d3c01a682" }
bedrock-services = { git = "https://github.com/cinnabar-mc/bedrock-services", rev = "b326d5a6a0e2dccab77f96f7265c87b4c7d642af", features = ["signaling-tokio"] }
nethernet = { git = "https://github.com/cinnabar-mc/nethernet", rev = "fc8094e03bbe0cfdf94bf7bffeeff7f09f864a2e" }
nethernet-tokio = { git = "https://github.com/cinnabar-mc/nethernet", rev = "fc8094e03bbe0cfdf94bf7bffeeff7f09f864a2e" }
p384 = { version = "0.14", default-features = false, features = ["alloc", "ecdsa", "ecdh", "pkcs8"] }
raknet = { git = "https://github.com/cinnabar-mc/raknet", rev = "4cb7fac06c2a530e0f98899637e1949e1037c553" }

[package]
name = "bedrock-net"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Native Rust transport and session foundations for Minecraft Bedrock"
repository = "https://github.com/cinnabar-mc/bedrock-net"
readme = "README.md"
publish = false

[features]
default = []
login = ["dep:base64", "dep:md-5", "dep:p384", "dep:serde", "dep:serde_json", "dep:uuid", "sha2/zeroize"]
raknet = ["dep:raknet", "dep:tokio"]
messaging = ["dep:bedrock-services", "dep:futures", "dep:nethernet", "dep:nethernet-tokio", "dep:tokio", "dep:uuid"]

[dependencies]
aes = { version = "0.9", features = ["zeroize"] }
base64 = { version = "0.22", optional = true }
bytes = "1"
bedrock-services = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
nethernet = { workspace = true, optional = true }
nethernet-tokio = { workspace = true, optional = true }
ctr = { version = "0.10", features = ["zeroize"] }
flate2 = "1"
md-5 = { version = "0.11", optional = true }
p384 = { workspace = true, optional = true }
raknet = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["raw_value"], optional = true }
sha2 = "0.11"
snap = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["net", "time", "macros"], optional = true }
zeroize = "1"
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "test-util", "process", "io-util"] }
tokio-websockets = { version = "0.13", default-features = false, features = ["client", "server", "aws_lc_rs", "getrandom"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"
perf = "warn"

[lints]
workspace = true
