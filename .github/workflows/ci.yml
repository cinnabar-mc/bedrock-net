name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked -p bedrock-net
      - run: cargo clippy --locked -p bedrock-net --all-targets -- -D warnings
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-oracle/go.mod
          cache-dependency-path: tools/go-oracle/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - working-directory: tools/go-oracle
        run: go run . > ../../tests/fixtures/go_batches.rs
      - run: cargo fmt --all
      - run: git diff --exit-code -- tests/fixtures/go_batches.rs
