name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: minimum-rust
        run: |
          python3 - <<'PY'
          import os, tomllib
          sources = {}
          with open("Cargo.lock", "rb") as lock:
              for package in tomllib.load(lock)["package"]:
                  source = package.get("source", "")
                  if source.startswith("git+"):
                      location = source.removeprefix("git+").split("#", 1)[0]
                      repository = location.split("?", 1)[0]
                      sources.setdefault(repository, set()).add(source)
          duplicated = [repository for repository, revisions in sources.items() if len(revisions) != 1]
          if duplicated:
              raise SystemExit("Multiple Git identities: " + ", ".join(sorted(duplicated)))
          with open("Cargo.toml", "rb") as manifest, open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("version=" + tomllib.load(manifest)["workspace"]["package"]["rust-version"], file=output)
          PY
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.minimum-rust.outputs.version }}
      - run: cargo +${{ steps.minimum-rust.outputs.version }} check --locked --workspace --all-targets --all-features
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/raknet-peer/go.mod
          cache-dependency-path: tools/raknet-peer/go.sum
      - name: Check the Go helpers use one RakNet baseline
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          identities = set()
          for manifest in pathlib.Path("tools").glob("*/go.mod"):
              modules = subprocess.check_output(
                  ["go", "list", "-mod=readonly", "-m", "-json", "all"],
                  cwd=manifest.parent, text=True,
              ).lstrip()
              while modules:
                  module, end = json.JSONDecoder().raw_decode(modules)
                  modules = modules[end:].lstrip()
                  if module["Path"] == "github.com/sandertv/go-raknet":
                      source = module.get("Replace", module)
                      identities.add((source["Path"], source["Version"]))
          if len(identities) != 1:
              raise SystemExit("Go helpers must select one RakNet baseline")
          PY
      - working-directory: tools/raknet-peer
        run: go build -o ../../target/raknet-peer.exe .
      - working-directory: tools/go-oracle
        run: |
          go build -o ../../target/login-check.exe ./cmd/login-check
          go build -o ../../target/pack-delivery-check.exe ./cmd/pack-delivery-check
          go build -o ../../target/go-oracle.exe .
          go build -o ../../target/interop-server.exe ./cmd/interop-server
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace --all-features
        env:
          BEDROCK_NET_RAKNET_PEER: ${{ github.workspace }}/target/raknet-peer.exe
          BEDROCK_NET_LOGIN_ORACLE: ${{ github.workspace }}/target/login-check.exe
          BEDROCK_NET_PACK_DELIVERY_ORACLE: ${{ github.workspace }}/target/pack-delivery-check.exe
          BEDROCK_NET_GO_ORACLE: ${{ github.workspace }}/target/go-oracle.exe
          BEDROCK_NET_GO_INTEROP: ${{ github.workspace }}/target/interop-server.exe
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-oracle/go.mod
          cache-dependency-path: tools/go-oracle/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - working-directory: tools/go-oracle
        run: go run . > ../../tests/fixtures/go_batches.rs
      - working-directory: tools/go-oracle
        run: go run ./cmd/bench-inputs ../../testdata/bench
      - working-directory: tools/go-oracle
        run: go vet ./... && go test -run . -bench '^$' ./...
      - working-directory: tools/bench-compare
        run: go vet ./... && go test ./...
      - run: cargo fmt --all
      - run: git diff --exit-code -- tests/fixtures/go_batches.rs testdata/bench
  # Go and Rust benchmarks on one runner, joined by tools/bench-compare. Not a required check:
  # some Rust paths are known to be slower than Go.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-oracle/go.mod
          cache-dependency-path: tools/go-oracle/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: Go benchmarks
        working-directory: tools/go-oracle
        run: |
          mkdir -p ../../target
          go test -run '^$' -bench . -benchmem -count 3 ./bench/ | tee ../../target/go-bench.txt
      - name: Rust benchmarks
        run: |
          cargo bench --locked -p bedrock-net --features login --bench batch --bench login -- --warm-up-time 1 --measurement-time 3
          cargo bench --locked -p bedrock-client --bench packs -- --warm-up-time 1 --measurement-time 3
      - name: Compare
        working-directory: tools/bench-compare
        shell: bash
        run: |
          set -o pipefail
          go run . --go ../../target/go-bench.txt --criterion ../../target/criterion | tee -a "$GITHUB_STEP_SUMMARY"
