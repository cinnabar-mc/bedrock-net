name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: minimum-rust
        run: |
          python3 - <<'PY'
          import os, tomllib
          sources = {}
          with open("Cargo.lock", "rb") as lock:
              for package in tomllib.load(lock)["package"]:
                  source = package.get("source", "")
                  if source.startswith("git+"):
                      location = source.removeprefix("git+").split("#", 1)[0]
                      repository = location.split("?", 1)[0]
                      sources.setdefault(repository, set()).add(source)
          duplicated = [repository for repository, revisions in sources.items() if len(revisions) != 1]
          if duplicated:
              raise SystemExit("Multiple Git identities: " + ", ".join(sorted(duplicated)))
          with open("Cargo.toml", "rb") as manifest, open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("version=" + tomllib.load(manifest)["workspace"]["package"]["rust-version"], file=output)
          PY
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.minimum-rust.outputs.version }}
      - run: cargo +${{ steps.minimum-rust.outputs.version }} check --locked --workspace --all-targets --all-features
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-oracle/go.mod
          cache-dependency-path: tools/go-oracle/go.sum
      - working-directory: tools/go-oracle
        run: |
          go build -o ../../target/login-check.exe ./cmd/login-check
          go build -o ../../target/pack-delivery-check.exe ./cmd/pack-delivery-check
          go build -o ../../target/go-oracle.exe .
          go build -o ../../target/interop-server.exe ./cmd/interop-server
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace --all-features
        env:
          BEDROCK_NET_LOGIN_ORACLE: ${{ github.workspace }}/target/login-check.exe
          BEDROCK_NET_PACK_DELIVERY_ORACLE: ${{ github.workspace }}/target/pack-delivery-check.exe
          BEDROCK_NET_GO_ORACLE: ${{ github.workspace }}/target/go-oracle.exe
          BEDROCK_NET_GO_INTEROP: ${{ github.workspace }}/target/interop-server.exe
          BEDROCK_NET_REQUIRE_FIXTURES: "1"
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-oracle/go.mod
          cache-dependency-path: tools/go-oracle/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - working-directory: tools/go-oracle
        run: go run . > ../../tests/fixtures/go_batches.rs
      - working-directory: tools/go-oracle
        run: go run ./cmd/bench-inputs ../../testdata/bench
      - name: Regenerate accepting client data
        working-directory: tools/go-oracle
        env:
          GOTOOLCHAIN: go1.26.1
        run: go run -mod=readonly ./cmd/accepting-client-data ../../src/login/accepting/client_data
      - name: Regenerate built-in pack catalog
        working-directory: tools/go-oracle
        run: go run -mod=readonly ./cmd/builtin-packs ../../crates/bedrock-client/data/builtin-packs.json
      - working-directory: tools/go-oracle
        run: go vet ./... && go test -run . -bench '^$' ./...
      - working-directory: tools/bench-compare
        run: go vet ./... && go test ./...
      - run: cargo fmt --all
      - run: git diff --exit-code -- tests/fixtures/go_batches.rs testdata/bench src/login/accepting/client_data/language_data.rs src/login/accepting/client_data/name_letters.rs crates/bedrock-client/data/builtin-packs.json
  # Go and Rust benchmarks on one runner, joined by tools/bench-compare. Not a required check.
  bench:
    runs-on: ubuntu-latest
    env:
      # Go benchmarks run with -cpu at this value; the comparator strips exactly that suffix.
      BENCH_GO_PROCS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-oracle/go.mod
          cache-dependency-path: tools/go-oracle/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: Go benchmarks
        working-directory: tools/go-oracle
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../target
          go test -run '^$' -bench . -benchmem -count 3 -cpu "$BENCH_GO_PROCS" ./bench/ | tee ../../target/go-bench.txt
      - name: Rust benchmarks
        run: |
          cargo bench --locked -p bedrock-net --features login --bench batch --bench login -- --warm-up-time 1 --measurement-time 3
          cargo bench --locked -p bedrock-client --bench packs -- --warm-up-time 1 --measurement-time 3
      # Slower Rust paths (exit 1) are reported as a warning while known gaps remain;
      # a missing or unpaired measurement (exit 3) or unreadable input (2) fails the job.
      - name: Compare
        working-directory: tools/bench-compare
        shell: bash
        run: |
          go build -o ../../target/bench-compare .
          status=0
          ../../target/bench-compare --go-procs "$BENCH_GO_PROCS" --go ../../target/go-bench.txt --criterion ../../target/criterion > ../../target/bench-table.md || status=$?
          cat ../../target/bench-table.md >> "$GITHUB_STEP_SUMMARY"
          cat ../../target/bench-table.md
          if [ "$status" = 1 ]; then
            echo "::warning::Rust is slower than Go beyond the margin on some paths"
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi
