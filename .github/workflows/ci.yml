name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: minimum-rust
        run: |
          python3 - <<'PY'
          import os, tomllib
          sources = {}
          with open("Cargo.lock", "rb") as lock:
              for package in tomllib.load(lock)["package"]:
                  source = package.get("source", "")
                  if source.startswith("git+"):
                      location = source.removeprefix("git+").split("#", 1)[0]
                      repository = location.split("?", 1)[0]
                      sources.setdefault(repository, set()).add(source)
          duplicated = [repository for repository, revisions in sources.items() if len(revisions) != 1]
          if duplicated:
              raise SystemExit("Multiple Git identities: " + ", ".join(sorted(duplicated)))
          with open("Cargo.toml", "rb") as manifest, open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("version=" + tomllib.load(manifest)["workspace"]["package"]["rust-version"], file=output)
          PY
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.minimum-rust.outputs.version }}
      - run: cargo +${{ steps.minimum-rust.outputs.version }} check --locked --workspace --all-targets --all-features
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/raknet-peer/go.mod
          cache-dependency-path: tools/raknet-peer/go.sum
      - working-directory: tools/raknet-peer
        run: go build -o ../../target/raknet-peer.exe .
      - working-directory: tools/go-oracle
        run: |
          go build -o ../../target/login-check.exe ./cmd/login-check
          go build -o ../../target/pack-delivery-check.exe ./cmd/pack-delivery-check
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace
        env:
          BEDROCK_NET_PACK_DELIVERY_ORACLE: ${{ github.workspace }}/target/pack-delivery-check.exe
      - run: cargo test --locked -p bedrock-net --all-features
        env:
          BEDROCK_NET_RAKNET_PEER: ${{ github.workspace }}/target/raknet-peer.exe
          BEDROCK_NET_LOGIN_ORACLE: ${{ github.workspace }}/target/login-check.exe
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-oracle/go.mod
          cache-dependency-path: tools/go-oracle/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - working-directory: tools/go-oracle
        run: go run . > ../../tests/fixtures/go_batches.rs
      - run: cargo fmt --all
      - run: git diff --exit-code -- tests/fixtures/go_batches.rs
