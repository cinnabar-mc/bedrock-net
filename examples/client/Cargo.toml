[package]
name = "bedrock-probe"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
bedrock-net = { path = "../..", features = ["raknet"] }
bedrock-protocol = { package = "bedrock-protocol-1-26-51", git = "https://github.com/cinnabar-mc/protocolgen", rev = "4e9626abbb51b8fa842f49b4aea0fb4d3c01a682" }
bytes = "1"
nethernet-tokio = { git = "https://github.com/cinnabar-mc/nethernet", rev = "e77711166259bd1efcfc80b44e9d953b5d721548" }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }

[lints]
workspace = true
