[package]
name = "bedrock-probe"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
bedrock-net = { path = "../..", features = ["raknet", "login"] }
bedrock-protocol.workspace = true
bedrock_auth = { git = "https://github.com/bedrock-crustaceans/bedrock-rs", rev = "ab7bb9521af078d4094c86da8b127d5f53cf0d31" }
bytes = "1"
nethernet-tokio = { git = "https://github.com/cinnabar-mc/nethernet", rev = "4a54074b2ad060260818d557e5ca47cf60172282" }
base64 = "0.22"
p384 = { version = "0.14", default-features = false, features = ["std", "ecdsa", "ecdh", "pkcs8"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
uuid = "1"

[lints]
workspace = true
