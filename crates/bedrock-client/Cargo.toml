[package]
name = "bedrock-client"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license-file = "../../LICENSE-CINNABAR"
description = "Caller-driven generated-packet Bedrock client negotiation"
repository = "https://github.com/cinnabar-mc/bedrock-net"
readme = "README.md"
publish = false

[dependencies]
bedrock-net = { path = "../..", features = ["login"] }
bedrock-packs = { path = "../bedrock-packs" }
bedrock-protocol.workspace = true
bytes = "1"
p384.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["serde"] }

[lints]
workspace = true
