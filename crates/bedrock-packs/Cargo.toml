[package]
name = "bedrock-packs"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license-file = "../../LICENSE-CINNABAR"
description = "Resource-pack text decoding and owned archive handoff for Bedrock clients"
repository = "https://github.com/cinnabar-mc/bedrock-net"
readme = "README.md"
publish = false

[dependencies]
serde = "1"
serde_json = "1"
uuid = "1"
zeroize = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
